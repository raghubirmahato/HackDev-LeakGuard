<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>HackDev LeakGuard - Settings</title>
<style>
  body { font: 14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 40px auto; background: #0f172a; color: #e2e8f0; padding: 0 16px; }
  h1 { color: #22c55e; font-size: 20px; }
  textarea { width: 100%; min-height: 100px; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 8px; font-family: monospace; }
  button { background: #16a34a; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-top: 8px; }
  button:hover { background: #15803d; }
  .hint { color: #94a3b8; font-size: 12px; }
  #saved { color: #22c55e; margin-left: 8px; font-size: 13px; }
</style>
</head>
<body>
  <h1>HackDev LeakGuard Settings</h1>

  <p>LeakGuard checks password fields on <strong>every website</strong> automatically &mdash; you don't need to add anything here.</p>

  <label for="whitelist"><strong>Excluded sites (optional)</strong></label>
  <p class="hint">Only list sites you want LeakGuard to <em>skip</em>, one per line (e.g. <code>internal-tool.example.com</code>). Subdomains are skipped too. Leave this empty to check everywhere.</p>
  <textarea id="whitelist" placeholder="Leave empty to check every site"></textarea>
  <br />
  <button id="save">Save</button>
  <span id="saved" style="display:none;">Saved</span>

  <script src="pagelogic.js"></script>
  <script src="options.js"></script>
</body>
</html>
