name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run offline unit tests
        run: node --test tests/test_pagelogic.js
      - name: Run live HIBP integration tests
        run: node --test tests/test_hibp_integration.js
